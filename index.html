<!DOCTYPE html>
<html translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#474747">
<title>Meteroid | Online Photo Editor</title>
<meta name="description" content="Meteroid Online Photo Editor lets you edit photos, apply effects, filters, add text, crop or resize pictures.">
<link rel="stylesheet" href="css/editor.css">
</head>
<body class="theme0">
<div id="app">
<div id="menubar">
<div class="mi" data-m="file"><span>File</span></div>
<div class="mi" data-m="edit"><span>Edit</span></div>
<div class="mi" data-m="image"><span>Image</span></div>
<div class="mi" data-m="layer"><span>Layer</span></div>
<div class="mi" data-m="select"><span>Select</span></div>
<div class="mi" data-m="filter"><span>Filter</span></div>
<div class="mi" data-m="view"><span>View</span></div>
<div class="mi" data-m="window"><span>Window</span></div>
<div class="mi" data-m="help"><span>Help</span></div>
</div>
<div id="optionsbar"><div id="tool-options"></div></div>
<div id="mainarea">
<div id="toolbar"></div>
<div id="workspace">
<div id="canvas-container">
<canvas id="canvas"></canvas>
<canvas id="overlay"></canvas>
</div>
<div id="bcur" style="display:none;position:absolute;pointer-events:none;border:1px solid #fff;border-radius:50%;z-index:50;box-shadow:0 0 0 1px rgba(0,0,0,0.5)"></div>
</div>
<div id="rightpanel">
<div class="ptabs">
<div class="ptab act" data-p="layers">Layers</div>
<div class="ptab" data-p="adjustments">Adj</div>
<div class="ptab" data-p="history">History</div>
</div>
<div class="pcontent" id="panel-layers">
<div class="lctrl">
<select id="blend">
<option value="normal">Normal</option><option value="dissolve">Dissolve</option><option value="darken">Darken</option><option value="multiply">Multiply</option><option value="colorBurn">Color Burn</option><option value="lighten">Lighten</option><option value="screen">Screen</option><option value="colorDodge">Color Dodge</option><option value="overlay">Overlay</option><option value="softLight">Soft Light</option><option value="hardLight">Hard Light</option><option value="difference">Difference</option><option value="exclusion">Exclusion</option><option value="hue">Hue</option><option value="saturation">Saturation</option><option value="color">Color</option><option value="luminosity">Luminosity</option>
</select>
<div class="opctrl"><span>Opacity:</span><input type="range" id="lopacity" min="0" max="100" value="100"><span id="oval">100%</span></div>
</div>
<div id="llist"></div>
<div class="lbtns">
<button id="btn-nl" title="New Layer">+</button>
<button id="btn-dl" title="Duplicate">⧉</button>
<button id="btn-rl" title="Delete">🗑</button>
<button id="btn-ml" title="Merge Down">⤓</button>
<button id="btn-fl" title="Flatten">⊟</button>
</div>
</div>
<div class="pcontent" id="panel-adjustments" style="display:none">
<div class="abtn" data-a="levels">Levels</div>
<div class="abtn" data-a="curves">Curves</div>
<div class="abtn" data-a="brightness">Brightness/Contrast</div>
<div class="abtn" data-a="huesat">Hue/Saturation</div>
<div class="abtn" data-a="colorbalance">Color Balance</div>
<div class="abtn" data-a="invert">Invert</div>
<div class="abtn" data-a="desaturate">Desaturate</div>
<div class="abtn" data-a="threshold">Threshold</div>
<div class="abtn" data-a="posterize">Posterize</div>
</div>
<div class="pcontent" id="panel-history" style="display:none">
<div id="hlist"></div>
</div>
</div>
</div>
<div id="statusbar">
<span id="stool">Brush</span>
<span id="szoom">100%</span>
<span id="ssize">800 × 600</span>
<span id="spos">0, 0</span>
<span id="ssel"></span>
</div>
</div>
<div id="cmenu" class="hid"></div>
<div id="moverlay" class="hid"><div id="modal"></div></div>
<input type="file" id="file-input" accept="image/*" style="display:none">
<script src="js/utils.js"></script>
<script src="js/tools.js"></script>
<script src="js/layers.js"></script>
<script src="js/canvas.js"></script>
<script src="js/menus.js"></script>
<script src="js/filters.js"></script>
<script src="js/fileops.js"></script>
<script src="js/app.js"></script>
</body>
</html>
